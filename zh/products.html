<script>
(function(){
'use strict';
const grid=document.getElementById('productGrid'), search=document.getElementById('productSearch'), shop=document.getElementById('shopFilter'), cat=document.getElementById('categoryFilter'), count=document.getElementById('productCount'), more=document.getElementById('showMore');
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows=[],limit=24;
function render(){
 const q=search.value.trim().toLocaleLowerCase('ru-RU');
 const selected=rows.filter(p=>(!shop.value||p.shop===shop.value)&&(!cat.value||p.category===cat.value)&&(!q||(p.name+' '+p.shop+' '+p.category).toLocaleLowerCase('ru-RU').includes(q)));
 const shown=selected.slice(0,limit);
 grid.innerHTML=shown.map(p=>'<article class="product-card"><a class="product-photo" href="'+esc(p.url)+'" target="_blank" rel="sponsored nofollow noopener" aria-label="'+esc(p.name)+' — открыть магазин">'+(p.image?'<img src="'+esc(p.image)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">':'<span>Фото товара</span>')+'</a><div class="product-body"><div class="product-shop">Реклама · '+esc(p.shop)+'</div><h2>'+esc(p.name)+'</h2><div><span class="product-price">'+new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(p.price)+' ₽</span>'+(p.oldprice?'<span class="product-old">'+new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(p.oldprice)+' ₽</span>':'')+'</div><div class="product-category">'+esc(p.category||'Товары')}</div><div class="product-buy"><a class="btn" href="'+esc(p.url)+'" target="_blank" rel="sponsored nofollow noopener">В магазин →</a></div></div></article>').join('');
 count.textContent='Найдено товаров: '+selected.length+' · магазинов: '+new Set(selected.map(p=>p.shop)).size;
 more.hidden=shown.length>=selected.length;
}
fetch('/data/products.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(data=>{
 rows=Array.isArray(data)?data:[];
 [...new Set(rows.map(p=>p.shop).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru')).forEach(v=>shop.insertAdjacentHTML('beforeend','<option value="'+esc(v)+'">'+esc(v)+'</option>'));
 [...new Set(rows.map(p=>p.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru')).forEach(v=>cat.insertAdjacentHTML('beforeend','<option value="'+esc(v)+'">'+esc(v)+'</option>'));
 count.textContent='Загружено товаров: '+rows.length;
 render();
}).catch(()=>{count.textContent='Не удалось загрузить товары. Обновите страницу позже.'});
[search,shop,cat].forEach(el=>el.addEventListener('input',()=>{limit=24;render()}));
more.addEventListener('click',()=>{limit+=24;render()});
})();
</script>
